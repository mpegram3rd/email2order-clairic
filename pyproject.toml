[project]
name = "clairic-test"
version = "0.1.0"
description = "Synthetic email data generator and clairic extraction experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "openai>=1.99.0",
    "requests>=2.34.2",
]

[project.scripts]
generate = "scripts.generate_emails:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
